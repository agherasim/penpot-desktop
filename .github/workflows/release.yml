name: Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0), for manual re-runs"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}-${{ github.run_number }}"
            PRERELEASE=false
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="v${GITHUB_REF_NAME#v}-${{ github.run_number }}"
            PRERELEASE=false
          else
            TAG="unstable-${{ github.run_number }}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build, assemble and ad-hoc sign Penpot.app bundle
        run: make bundle BUNDLE_DIR=build/Penpot.app

      - name: Create DMG
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          DMG_NAME="Penpot-${TAG}.dmg"
          hdiutil create -volname "Penpot" -srcfolder build/Penpot.app -ov -format UDZO "$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Clean up old unstable releases
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          gh api "repos/${{ github.repository }}/releases" --paginate --jq \
            '[.[] | select(.tag_name | startswith("unstable-"))] | .[].tag_name' \
            | tail -n "+$((KEEP + 1))" \
            | while read -r tag; do
                echo "Deleting old unstable release: $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              done

  homebrew:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@SHA256@/${SHA}/" \
            packaging/homebrew/penpot-desktop.rb.in > penpot-desktop.rb

      - name: Push formula to tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "TAP_DEPLOY_KEY not set; skipping tap update"
            exit 0
          fi
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:agherasim/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp penpot-desktop.rb tap/Formula/penpot-desktop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/penpot-desktop.rb
          git commit -m "penpot-desktop ${GITHUB_REF_NAME#v}" || exit 0
          # Other projects push to the same tap; rebase onto theirs if we raced.
          for i in 1 2 3; do
            git push && break
            git pull --rebase
          done
