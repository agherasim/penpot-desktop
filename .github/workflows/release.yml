name: Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0), for manual re-runs"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}-${{ github.run_number }}"
            PRERELEASE=false
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="v${GITHUB_REF_NAME#v}-${{ github.run_number }}"
            PRERELEASE=false
          else
            TAG="unstable-${{ github.run_number }}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build and assemble Penpot.app bundle
        env:
          APP_DIR: build/Penpot.app
        run: |
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RES_DIR="$CONTENTS_DIR/Resources"
          mkdir -p "$MACOS_DIR" "$RES_DIR"

          swiftc -O -o "$MACOS_DIR/PenpotMenuBar" \
            src/menubar/*.swift Sources/DockerStats/DockerStatsParser.swift \
            -framework Cocoa

          cp src/app/Info.plist "$CONTENTS_DIR/Info.plist"
          cp src/app/docker-compose.yaml "$MACOS_DIR/docker-compose.yaml"
          cp .env.example "$MACOS_DIR/.env.example"
          cp .version "$MACOS_DIR/.version"
          cp src/scripts/Penpot "$MACOS_DIR/Penpot"
          cp src/scripts/setup.sh "$MACOS_DIR/setup.sh"
          chmod +x "$MACOS_DIR/Penpot" "$MACOS_DIR/setup.sh"
          cp src/resources/AppIcon.icns "$RES_DIR/AppIcon.icns"
          cp src/resources/MenuBarIconTemplate.png "$RES_DIR/MenuBarIconTemplate.png"
          cp src/resources/MenuBarIconTemplate@2x.png "$RES_DIR/MenuBarIconTemplate@2x.png"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - build/Penpot.app

      - name: Create DMG
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          DMG_NAME="Penpot-${TAG}.dmg"
          hdiutil create -volname "Penpot" -srcfolder build/Penpot.app -ov -format UDZO "$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Clean up old unstable releases
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          gh api "repos/${{ github.repository }}/releases" --paginate --jq \
            '[.[] | select(.tag_name | startswith("unstable-"))] | .[].tag_name' \
            | tail -n "+$((KEEP + 1))" \
            | while read -r tag; do
                echo "Deleting old unstable release: $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              done
